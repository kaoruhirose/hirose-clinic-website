  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#293832;background:#e5e5df}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:#f9f9f6;border-bottom:1px solid #d5d8d0;gap:20px}.label{font-size:12px;letter-spacing:.08em}.label small{font-size:10px;color:#747b72;display:block;margin-top:5px}.concepts{display:flex;align-items:center;gap:6px}.concepts button{background:transparent;border:1px solid transparent;padding:10px 20px;font-size:12px;white-space:nowrap;border-radius:2px}.concepts button[aria-pressed=true]{background:#293b34;color:white}.devices{display:flex;align-items:center;gap:13px;font-size:11px}.devices button{border:0;border-bottom:1px solid transparent;padding:10px 0;background:none;color:#788077}.devices button[aria-pressed=true]{color:#293832;border-color:currentColor}a{color:inherit;text-decoration:none;text-underline-offset:4px}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:2px solid #2d6955;outline-offset:3px}.stage{height:calc(100dvh - 108px);display:flex;justify-content:center;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#f5f3ed;display:block;transition:none}.stage.mobile{padding:15px 0}.stage.mobile iframe{width:390px;max-width:100%;box-shadow:0 5px 30px #28372d15}footer{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 25px;background:#f9f9f6;font-size:11px;gap:16px;color:#626d62}#description{margin:0}footer a{white-space:nowrap}.links-info{color:#7a8079;font-size:10px;margin-left:20px}@media(max-width:780px){header{height:103px;padding:13px 15px;flex-wrap:wrap;gap:8px}.label{font-size:11px}.label small{display:none}.concepts{order:3;width:100%;justify-content:center}.concepts button{padding:8px 21px}.devices{gap:13px;font-size:10px}.stage{height:calc(100dvh - 158px)}footer{height:55px;padding:8px 15px;font-size:10px;line-height:1.6}.links-info{display:none}#description{max-width:75%}.stage.mobile{padding:0}iframe{transition:none}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
  </style>
