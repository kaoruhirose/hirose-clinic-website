<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身土不二｜文字と配置の比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeede7;color:#343d37;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}.toolbar{padding:20px 24px;background:#f6f5f0;border-bottom:1px solid #343d3729}.toolbar h1{font-size:18px;font-weight:500;margin:0 0 6px}.toolbar p{margin:0 0 12px;color:#697068}.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}.group{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;min-height:44px;padding:7px 13px;border:1px solid #697068;background:transparent;color:inherit;border-radius:2px;cursor:pointer}button[aria-pressed=true]{background:#343d37;color:#fff}button:focus-visible{outline:2px solid #2a5d3e;outline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:24px;max-width:1400px;margin:24px auto;padding:0 24px}article{min-width:0}article h2{margin:0;font-size:16px;font-weight:500}article>p{margin:4px 0 12px;font-size:13px;color:#596158;min-height:24px}.frame-window{background:#f6f5f0;overflow:hidden;position:relative;border:1px solid #343d3729;margin-inline:auto}iframe{display:block;position:absolute;left:0;top:0;transform-origin:top left;border:0}article[hidden]{display:none}main.single{grid-template-columns:1fr;max-width:1200px}.footnote{padding:0 24px 24px;max-width:1400px;margin:auto;color:#697068;font-size:12px}@media(max-width:500px){.toolbar{padding:16px}main{padding:0 16px;gap:28px}}
</style></head><body><header class="toolbar"><h1>身土不二 · 文字と配置の比較</h1><p>比較用サンプルです。文章・題の大きさ・列の間隔は共通。サイト本体には未反映です。</p><div class="controls"><div class="group" aria-label="比較する案"><button data-view="all" aria-pressed="true">3案を並べる</button><button data-view="a" aria-pressed="false">A 現状</button><button data-view="b" aria-pressed="false">B 本文を控えめに</button><button data-view="c" aria-pressed="false">C 題も濃く</button></div><div class="group" aria-label="画面幅"><button data-width="375" aria-pressed="true">スマホ 375px</button><button data-width="1440" aria-pressed="false">PC 1440px</button></div></div></header><main><article data-variant="a"><h2>A · 現状</h2><p>本文16px・題と同じ高さ・題は淡い色</p><div class="frame-window"><iframe title="A · 現状" src="philosophy-a.html"></iframe></div></article><article data-variant="b"><h2>B · 本文を控えめに</h2><p>本文15px・書き出しを一文字分下げる</p><div class="frame-window"><iframe title="B · 本文を控えめに" src="philosophy-b.html"></iframe></div></article><article data-variant="c"><h2>C · 題も濃く</h2><p>Bと同じ配置＋「身土不二」を本文と同じ濃さに</p><div class="frame-window"><iframe title="C · 題も濃く" src="philosophy-c.html"></iframe></div></article></main><p class="footnote" id="scale-note">スマホ375px・PC1440pxの配置を再現しています。表示領域より広い場合は縮小して収めます。</p><script>
(()=>{let width=375,view='all';const main=document.querySelector('main');function layout(){document.querySelectorAll('article').forEach(a=>{a.hidden=view!=='all'&&a.dataset.variant!==view;if(a.hidden)return;const win=a.querySelector('.frame-window'),frame=a.querySelector('iframe'),available=a.clientWidth,scale=Math.min(1,available/width),height=width===375?510:620;win.style.width=(width*scale)+'px';win.style.height=(height*scale)+'px';frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';});}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));main.classList.toggle('single',view!=='all');layout();}));document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{width=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));layout();}));new ResizeObserver(layout).observe(main);layout();})();
</script></body></html>
